# .github/workflows/docker-image.yml – construit l'image du serveur et la pousse
# sur GHCR, pour que le serveur de production n'ait plus à la construire.
#
# `main` → étiquettes `main` et `<sha>`.
#
# Construire sur le serveur faisait grossir le démon Docker (BuildKit tourne
# dans dockerd et garde sa mémoire) : 1,9 Go de RAM le 26/10/2026, 17 Go de
# cache de build sur le disque. Le serveur se contente maintenant de tirer
# l'image (`./deploy.sh`). La construction sur place reste possible en secours,
# si les minutes GitHub Actions venaient à manquer : `./deploy.sh --local`.
#
# Les NEXT_PUBLIC_* sont figées dans le bundle client au build. Elles sont
# publiques par nature ; on peut les surcharger par des variables de dépôt
# (Settings → Secrets and variables → Actions → Variables). Aucun secret ne
# passe par ici : AUTH_SECRET et le reste arrivent à l'exécution par `.env`.

name: Image Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - "sharex-mobile/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/pedrokarim/sharex-manager:${{ github.ref_name }}
            ghcr.io/pedrokarim/sharex-manager:${{ github.sha }}
          # Mêmes valeurs que le `.env` de production.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://sxm.ascencia.re' }}
            NEXT_PUBLIC_IMAGE_DOMAIN=${{ vars.NEXT_PUBLIC_IMAGE_DOMAIN || 'img.ascencia.re' }}
            NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN || 'sxm.ascencia.re' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://sxm.ascencia.re' }}
          # Cache des couches entre deux builds (dépendances surtout).
          cache-from: type=gha
          cache-to: type=gha,mode=max
