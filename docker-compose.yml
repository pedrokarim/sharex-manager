services:
  sharex-manager:
    build:
      context: .
      target: runner
      # Indispensable, pas redondant avec le bloc `environment` : Next fige les
      # NEXT_PUBLIC_* dans le bundle client pendant `bun run build`. Sans ces
      # args, le navigateur reçoit les valeurs de repli du code.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_IMAGE_DOMAIN: ${NEXT_PUBLIC_IMAGE_DOMAIN:-img.ascencia.re}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:-sxm.ascencia.re}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://sxm.ascencia.re}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - NEXT_PUBLIC_IMAGE_DOMAIN=${NEXT_PUBLIC_IMAGE_DOMAIN:-img.ascencia.re}
      - NEXT_PUBLIC_APP_DOMAIN=${NEXT_PUBLIC_APP_DOMAIN:-ascencia.re}
      # URL publique utilisée par les metadata et les images Open Graph. Comme
      # tout NEXT_PUBLIC_*, elle est figée dans le bundle au moment du build,
      # d'où sa présence aussi dans `args`.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://sxm.ascencia.re}
      - TZ=Europe/Paris
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Montage des dossiers locaux
      - ./config:/app/config
      - ./uploads:/app/uploads:delegated
      - ./data:/app/data
      # Données runtime des modules (images générées, historiques, secrets.json).
      # `modules/` est cuit dans l'image : sans ce montage, tout serait perdu à
      # chaque rebuild. Les clés API peuvent aussi passer par .env, qui prime.
      - ./module-data/ai-image-gen:/app/modules/ai-image-gen/data
      # Session Codex du module ai-image-gen. Sans ce montage, il faudrait se
      # reconnecter après chaque redéploiement : le jeton vit dans ce dossier.
      # Connexion initiale, une seule fois, sans navigateur sur le serveur :
      #   docker compose exec sharex-manager codex login --device-auth
      - ./codex-home:/app/codex-home
      - next-cache:/app/.next/cache

volumes:
  next-cache:
